<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Consultation booking registration</title>
  </head>
  <body>
    <form
      name="consultation-booking"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="consultation-booking" />
      <input name="subject" />
      <input name="service-id" />
      <input name="service-name" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="consultation-mode" />
      <input name="birth-date" />
      <input name="birth-time" />
      <input name="birth-place" />
      <input name="language" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
